name: converter rates

# ECB reference rates are published around 16:00 CET on working days.
# GitHub only runs schedules from the default branch, so while the app lives on a
# feature branch the job also runs when the job itself changes on that branch.
on:
  schedule:
    - cron: "37 16 * * 1-5"
  workflow_dispatch:
  push:
    paths: ["converter/fetch_rates.py", ".github/workflows/converter-rates.yml"]

permissions:
  contents: write

concurrency:
  group: converter-rates
  cancel-in-progress: false

jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # On failure the script exits non-zero and the committed rates.json stays as the last good file.
      - run: python converter/fetch_rates.py --out converter/rates.json
      - name: Commit if changed
        run: |
          git add converter/rates.json
          if git diff --cached --quiet; then
            echo "rates unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "converter: update rates $(python -c 'import json;print(json.load(open("converter/rates.json"))["date"])')"
          git push origin HEAD:${{ github.ref_name }}
