name: android apk

on:
  push:
    paths: ["android/**", "converter/master-list.sample.json", "converter/golden.json", ".github/workflows/android-apk.yml"]
  pull_request:
    paths: ["android/**", "converter/master-list.sample.json", "converter/golden.json", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Engine tests replay the Python reference answers (converter/golden.json).
      - run: ./gradlew --no-daemon :engine:test :app:assembleDebug -PratesBranch=${{ github.head_ref || github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: converter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/engine/build/reports/tests/
