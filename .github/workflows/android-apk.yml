name: android apk

on:
  push:
    paths: ["android/**", "converter/master-list.sample.json", "converter/golden.json", ".github/workflows/android-apk.yml"]
  pull_request:
    paths: ["android/**", "converter/master-list.sample.json", "converter/golden.json", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Engine tests replay the Python reference answers (converter/golden.json).
      - run: ./gradlew --no-daemon :engine:test :app:assembleDebug -PratesBranch=${{ github.head_ref || github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: converter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/engine/build/reports/tests/

  # Launch the APK on an emulator: catches crashes that JVM tests can't (Android runtime differences).
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: converter-debug-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: android/scripts/smoke-test.sh app-debug.apk
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: |
            logcat.txt
            screenshot.png
